<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · RecallCare</title><link rel="stylesheet" href="/static/app.css"></head>
<body>
<main class="login card">
  <div class="brand" style="margin-bottom:1rem"><span class="logo">R</span>RecallCare</div>
  <p class="muted small">Staff dashboard for {{ clinic.name }} (a fictional clinic). All patient data is synthetic.</p>
  {% if error %}<p style="color:var(--critical)" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label for="u" class="small">Username</label><input id="u" name="username" autocomplete="username" required>
    <label for="p" class="small">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required>
    <button class="primary" style="width:100%">Sign in</button>
  </form>
</main>
</body>
</html>
