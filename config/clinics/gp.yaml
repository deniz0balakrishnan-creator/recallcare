# Second clinic type, same agents: a FICTIONAL family GP clinic.
# Run it with:  CLINIC_CONFIG=config/clinics/gp.yaml make demo
#
# Everything not listed here is inherited from dental.yaml, including every safety keyword list (injection,
# impersonation, opt-out, other patients' data, abuse, complaints, billing, requests for a human).
# Only the clinic-specific parts change. Intervals are ILLUSTRATIVE and CONFIGURABLE BY THE CLINIC — not medical
# guidance; a real clinic would set them from its own protocols and national recommendations.

inherit: config/clinics/dental.yaml

clinic:
  id: kingfisher_gp
  type: gp
  kind: family GP clinic
  name: Kingfisher Family Clinic
  fictional: true
  address: "Blk 402 Kingfisher Street, #01-08, Singapore 000402 (fictional)"
  phone_display: "6555 0400 (fictional)"
  timezone: Asia/Singapore
  languages: [en, zh, ms, ta]
  dentists:            # practitioners (the key name is shared with dental.yaml)
    - {id: D1, name: "Dr Tan Mei Xin"}
    - {id: D2, name: "Dr Hafiz Rahman"}

calendar:
  slot_minutes: 30
  horizon_days: 14
  parts_of_day:
    morning:   ["08:30", "12:30"]
    afternoon: ["14:00", "17:00"]
    evening:   ["18:30", "21:00"]
  sessions:
    0: [["08:30", "12:30"], ["14:00", "17:00"], ["18:30", "21:00"]]
    1: [["08:30", "12:30"], ["14:00", "17:00"], ["18:30", "21:00"]]
    2: [["08:30", "12:30"], ["14:00", "17:00"], ["18:30", "21:00"]]
    3: [["08:30", "12:30"], ["14:00", "17:00"], ["18:30", "21:00"]]
    4: [["08:30", "12:30"], ["14:00", "17:00"], ["18:30", "21:00"]]
    5: [["08:30", "12:30"]]
    6: []
  seed_occupancy: 0.45
  max_options_offered: 3
  max_active_bookings_per_patient: 1

# Recall intervals — ILLUSTRATIVE, CONFIGURABLE BY THE CLINIC (not medical guidance).
visit_types:
  chronic_review:        {label: "Chronic condition review",   interval_months: 3,  duration_min: 30}
  health_screening:      {label: "Health screening",           interval_months: 12, duration_min: 30}
  medication_review:     {label: "Medication review",          interval_months: 6,  duration_min: 30}
  post_consult_review:   {label: "Follow-up consultation",     interval_months: null, duration_min: 30, note: "date set by the doctor"}
  childhood_vaccination: {label: "Childhood vaccination",      interval_months: 6,  duration_min: 30}
  flu_vaccination:       {label: "Influenza vaccination",      interval_months: 12, duration_min: 30}

# The synthetic population is shared; this maps its recall types onto this clinic's visit types.
seed_type_map:
  routine_checkup: chronic_review
  scaling_polishing: health_screening
  perio_maintenance: medication_review
  treatment_followup: post_consult_review
  child_checkup: childhood_vaccination
  denture_review: flu_vaccination

urgency:
  per_overdue_month: 2.0
  overdue_month_cap: 24
  visit_type_bonus:
    post_consult_review: 20
    chronic_review: 12
    medication_review: 8
    childhood_vaccination: 8
    flu_vaccination: 4
  age_65_plus: 6
  chas_cardholder: 4
  long_gap_bonus_months: 12
  long_gap_bonus: 8
  due_soon_days: 14
  levels:
    urgent: 50
    soon: 20

impact_assumptions:
  minutes_per_manual_outreach: 4
  minutes_per_booking_conversation: 6
  minutes_per_logistics_answer: 2
  minutes_per_triage_patient_review: 1.5

# Only the clinical list changes. It targets SYMPTOMS, not the names of the conditions this clinic reviews:
# "can I book my diabetes review?" is routine; "chest pain" is not.
prescreen:
  clinical:
    en: ["chest pain", "chest tightness", "breathless", "short of breath", "shortness of breath", "can't breathe", "cannot breathe", "fever", "high fever", "fainted", "faint", "dizzy", "vomiting", "severe pain", "pain", "painful", "hurts", "bleeding", "coughing blood", "rash", "swelling", "swollen", "allergic reaction", "medication", "medicine", "dose", "dosage", "side effect", "side effects", "pregnant", "hypo", "blood sugar too high", "blood sugar too low", "numbness", "confused", "unconscious"]
    zh: ["胸痛", "胸闷", "呼吸困难", "喘不过气", "发烧", "发热", "晕倒", "头晕", "呕吐", "痛", "疼", "出血", "咳血", "皮疹", "肿", "过敏", "药", "副作用", "怀孕", "麻木"]
    ms: ["sakit dada", "sesak nafas", "susah bernafas", "demam", "pengsan", "pening", "muntah", "sakit", "berdarah", "ruam", "bengkak", "alahan", "ubat", "kesan sampingan", "mengandung", "kebas"]
    ta: ["நெஞ்சு வலி", "மூச்சுத் திணறல்", "காய்ச்சல்", "மயக்கம்", "தலைச்சுற்றல்", "வாந்தி", "வலி", "இரத்தப்போக்கு", "தடிப்பு", "வீக்கம்", "ஒவ்வாமை", "மருந்து", "பக்க விளைவு", "மரத்துப்போதல்"]

# Info sheet — the ONLY source for logistics answers. Prices are published ranges (illustrative).
info_sheet:
  hours: "Mon–Fri 8:30am–12:30pm, 2:00pm–5:00pm and 6:30pm–9:00pm; Sat 8:30am–12:30pm; closed Sundays and public holidays."
  address: "Blk 402 Kingfisher Street, #01-08, Singapore 000402 (fictional). Next to the (fictional) Kingfisher bus interchange."
  parking: "Public carpark at Blk 404, opposite the clinic. Coupon/electronic parking applies."
  accessibility: "Ground-floor clinic with step-free access; wheelchair friendly."
  languages: "Our team speaks English, Mandarin, Malay and Tamil."
  prices: "Published price ranges (illustrative, before any subsidy): consultation S$25–S$45; chronic condition review S$30–S$60; health screening S$40–S$120; influenza vaccination S$20–S$45. The doctor confirms the exact cost before any procedure."
  subsidies: "CHAS, Pioneer Generation and Merdeka Generation cardholders may be eligible for subsidies, and Healthier SG enrollees should ask about the benefits at their enrolled clinic. Please bring your card — our staff will check your eligibility at the visit."
  payment: "We accept cash, NETS, PayNow and major credit cards."
  what_to_bring: "Please bring your NRIC, any CHAS/PG/MG card, your medicines or their list, and any home readings (for example blood pressure) if you have them."
  reschedule_policy: "You can change or cancel your appointment by replying here or calling us at least 24 hours before."
  children: "Children are welcome. Patients under 18 should come with a parent or guardian."
  booking: "You can book by replying to this chat — I'll offer you available times."

# Translations used only by the mock model (the live model translates the English info sheet itself).
info_sheet_i18n:
  hours:
    zh: "营业时间：星期一至五 上午8:30–中午12:30、下午2:00–5:00、晚上6:30–9:00；星期六 上午8:30–中午12:30；星期日及公共假期休息。"
    ms: "Waktu operasi: Isnin–Jumaat 8:30 pagi–12:30 tengah hari, 2:00–5:00 petang dan 6:30–9:00 malam; Sabtu 8:30 pagi–12:30 tengah hari; tutup hari Ahad dan cuti umum."
    ta: "நேரம்: திங்கள்–வெள்ளி காலை 8:30–மதியம் 12:30, மதியம் 2:00–மாலை 5:00, மாலை 6:30–இரவு 9:00; சனி காலை 8:30–மதியம் 12:30; ஞாயிறு மற்றும் பொது விடுமுறை நாட்களில் மூடப்பட்டிருக்கும்."
  prices:
    zh: "公布的价格范围（仅供参考，未计补贴）：门诊 S$25–S$45；慢性病复诊 S$30–S$60；健康检查 S$40–S$120；流感疫苗 S$20–S$45。医生会在任何处理前确认实际费用。"
    ms: "Julat harga (anggaran, sebelum subsidi): konsultasi S$25–S$45; semakan penyakit kronik S$30–S$60; saringan kesihatan S$40–S$120; vaksinasi influenza S$20–S$45. Doktor akan mengesahkan kos sebenar terlebih dahulu."
    ta: "விலை வரம்புகள் (மானியத்திற்கு முன், மதிப்பீடு): ஆலோசனை S$25–S$45; நாள்பட்ட நோய் மறுபரிசோதனை S$30–S$60; உடல்நலப் பரிசோதனை S$40–S$120; இன்ஃப்ளூயன்ஸா தடுப்பூசி S$20–S$45. மருத்துவர் முன்கூட்டியே சரியான செலவை உறுதிப்படுத்துவார்."
