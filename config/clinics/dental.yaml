# Info sheet — the ONLY source for logistics answers. Prices are published ranges (illustrative).
info_sheet:
  about: "This is Sunbird Family Dental's WhatsApp assistant. It is an automated assistant, not a person. It helps you book, change or cancel your appointment and answers practical questions about the clinic, such as opening hours, location, prices and what to bring. Anything about your health or treatment goes to our clinic staff, and you can ask to speak to a person at any time."
  why_contacted: "You are a registered patient of Sunbird Family Dental, and you agreed to receive appointment reminders on WhatsApp at this number. We only contact you about your own appointments. If you are unsure whether this message is genuine, call the clinic on 6555 0000 (fictional). Reply STOP at any time to stop these reminders."
  privacy: "Only our clinic staff can read this conversation, on a password-protected system. An automated assistant helps with replies about appointments and clinic information; anything about your health is passed to our staff. We use your details only for your appointments and care, never for marketing. Reply STOP to stop messages at any time, or ask our staff to delete this conversation."
  visit_types: "Routine check-up (about 30 minutes): a regular examination of your teeth and gums. Scaling & polishing (about 45 minutes): a professional clean that removes tartar and stains. Gum care (periodontal) review (about 60 minutes): a follow-up visit to check on your gums after earlier gum treatment. Treatment follow-up (about 30 minutes): a visit to continue or check treatment you have already started. Child dental check-up (about 30 minutes): a check-up for children. Denture review (about 30 minutes): a check of how your dentures fit. The dentist will explain anything specific to you at the visit."
  hours: "Mon–Fri 9:00am–1:00pm, 2:00pm–6:00pm and 7:00pm–9:00pm; Sat 9:00am–1:00pm; closed Sundays and public holidays."
  address: "Blk 218 Sunbird Walk, #01-12, Singapore 000218 (fictional). 5 minutes' walk from the (fictional) Sunbird MRT station, Exit B. Bus stop right outside Blk 218."
  parking: "Public carpark at Blk 220, next to the clinic. Coupon/electronic parking applies."
  accessibility: "Step-free access via the lift lobby at Blk 218; wheelchair friendly. Tell us if you need help on arrival."
  languages: "Our team speaks English, Mandarin, Malay and Tamil."
  prices: "Published price ranges (illustrative, before any subsidy): check-up & consultation S$30–S$60; scaling & polishing S$60–S$120; dental X-ray S$20–S$50; gum care (periodontal) review S$80–S$150; denture review S$30–S$60. The dentist confirms the exact cost before any treatment."
  subsidies: "CHAS, Pioneer Generation and Merdeka Generation cardholders may be eligible for subsidies on selected dental services. Please bring your card — our staff will check your eligibility at the visit. MediSave generally cannot be used for routine check-ups or cleaning; it may apply to some surgical dental procedures, which our staff can confirm for you."
  payment: "We accept cash, NETS, PayNow and major credit cards. For company insurance, we can give you an itemised receipt to submit to your insurer."
  what_to_bring: "Please bring your NRIC and any CHAS/PG/MG card. If you take regular medicines, bring the list or the packets so the dentist can see them."
  reschedule_policy: "You can change or cancel your appointment by replying here or calling us at least 24 hours before."
  children: "Children are welcome. Patients under 18 should come with a parent or guardian."
  booking: "You can book by replying to this chat — I'll offer you available times."
