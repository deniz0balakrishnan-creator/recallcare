# Clinic configuration — ALL clinic-specific rules live here so a new clinic type is a config change.
# FICTIONAL clinic. Every clinical interval below is ILLUSTRATIVE, CONFIGURABLE BY THE CLINIC,
# and is an assumption for the demo — not medical guidance.

clinic:
  id: sunbird_dental
  type: dental
  kind: dental clinic
  name: Sunbird Family Dental
  fictional: true
  address: "Blk 218 Sunbird Walk, #01-12, Singapore 000218 (fictional)"
  phone_display: "6555 0000 (fictional)"
  timezone: Asia/Singapore
  languages: [en, zh, ms, ta]
  dentists:
    - {id: D1, name: "Dr Lim Wei Jie"}
    - {id: D2, name: "Dr Nur Aisyah Rahman"}
    - {id: D3, name: "Dr Ravi Shankar"}

calendar:
  slot_minutes: 30
  horizon_days: 14
  # part_of_day boundaries used by find_slots
  parts_of_day:
    morning:   ["09:00", "13:00"]
    afternoon: ["14:00", "18:00"]
    evening:   ["18:00", "21:00"]
  # opening sessions per weekday (0=Mon … 6=Sun)
  sessions:
    0: [["09:00", "13:00"], ["14:00", "18:00"], ["19:00", "21:00"]]
    1: [["09:00", "13:00"], ["14:00", "18:00"], ["19:00", "21:00"]]
    2: [["09:00", "13:00"], ["14:00", "18:00"], ["19:00", "21:00"]]
    3: [["09:00", "13:00"], ["14:00", "18:00"], ["19:00", "21:00"]]
    4: [["09:00", "13:00"], ["14:00", "18:00"], ["19:00", "21:00"]]
    5: [["09:00", "13:00"]]
    6: []
  seed_occupancy: 0.45        # share of future slots already taken in the synthetic calendar
  max_options_offered: 3
  max_active_bookings_per_patient: 1

# Recall intervals — ILLUSTRATIVE, CONFIGURABLE BY THE CLINIC (not medical guidance).
visit_types:
  routine_checkup:    {label: "Routine check-up",          interval_months: 6,  duration_min: 30}
  scaling_polishing:  {label: "Scaling & polishing",       interval_months: 6,  duration_min: 45}
  perio_maintenance:  {label: "Gum care (periodontal) review", interval_months: 3, duration_min: 60}
  treatment_followup: {label: "Treatment follow-up",       interval_months: null, duration_min: 30, note: "due date set by the dentist in the treatment plan"}
  child_checkup:      {label: "Child dental check-up",     interval_months: 6,  duration_min: 30}
  denture_review:     {label: "Denture review",            interval_months: 12, duration_min: 30}

# Deterministic urgency scoring (app/core/recall.py). Weights are configurable by the clinic.
urgency:
  per_overdue_month: 2.0       # points per month past due
  overdue_month_cap: 24        # stop adding after this many months
  visit_type_bonus:
    treatment_followup: 20     # an unfinished treatment plan matters most
    perio_maintenance: 10
    denture_review: 3
    child_checkup: 5
  age_65_plus: 6               # older adults: higher oral-health risk, more likely to drift
  chas_cardholder: 4           # cost-sensitive patients drift silently
  long_gap_bonus_months: 12    # extra bonus once a patient is >12 months overdue
  long_gap_bonus: 8
  due_soon_days: 14            # also list patients due within this many days (score 0 + bonuses)
  levels:                      # score thresholds → urgency label
    urgent: 50
    soon: 20

outreach:
  daily_batch_size: 12
  renudge_after_days: 5        # single gentle re-nudge for non-responders
  max_nudges: 1
  no_response_after_days: 10   # after the re-nudge, mark no_response
  window_hours: 24             # WhatsApp customer-service window
  send_hours: ["09:00", "20:30"]   # never message patients outside these local hours

# Staff-time assumptions for the Impact page (Assumption — stated, not measured).
impact_assumptions:
  minutes_per_manual_outreach: 4     # look up record + compose + send one reminder
  minutes_per_booking_conversation: 6
  minutes_per_logistics_answer: 2
  minutes_per_triage_patient_review: 1.5

